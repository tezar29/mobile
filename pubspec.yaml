name: jarvis_ai
description: "JARVIS AI — assistant personnel intelligent (Android/iOS)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # État & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Réseau
  dio: ^5.6.0
  web_socket_channel: ^3.0.1

  # Stockage sécurisé (tokens JWT, clé biométrique)
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # Biométrie
  local_auth: ^2.3.0

  # Voix (branché à l'étape 4)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  just_audio: ^0.9.40
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # UI / animations holographiques
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  # assets:
  #   - assets/animations/
  #   - assets/fonts/
